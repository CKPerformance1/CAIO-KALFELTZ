<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" role="img" aria-label="Gráfico de evolução por ciclos de treino">
  <defs>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B22020" stop-opacity=".55"/>
      <stop offset="1" stop-color="#B22020" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".04"/>
    </linearGradient>
    <clipPath id="reveal"><rect class="clip" x="0" y="0" width="640" height="280"/></clipPath>
  </defs>
  <style>
    .grid line{stroke:#ffffff;stroke-opacity:.07;stroke-width:1}
    .b{transform-box:fill-box;transform-origin:50% 100%;animation:grow 1s cubic-bezier(.2,.8,.2,1) both}
    .b2{animation-delay:.15s}.b3{animation-delay:.3s}.b4{animation-delay:.45s}.b5{animation-delay:.6s}.b6{animation-delay:.75s}
    .line{fill:none;stroke:#e23a3a;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:760;stroke-dashoffset:760;animation:draw 2.2s .5s cubic-bezier(.65,0,.35,1) forwards}
    .clip{transform:scaleX(0);transform-origin:0 0;animation:wipe 2.2s .5s cubic-bezier(.65,0,.35,1) forwards}
    .pt{fill:#0d0d0d;stroke:#e23a3a;stroke-width:3;opacity:0;animation:pop .4s ease-out forwards}
    .p1{animation-delay:.7s}.p2{animation-delay:1.1s}.p3{animation-delay:1.5s}.p4{animation-delay:1.9s}.p5{animation-delay:2.3s}
    .end{fill:#e23a3a;opacity:0;animation:pop .4s 2.6s ease-out forwards}
    .pulse{fill:none;stroke:#e23a3a;stroke-width:2;opacity:0;transform-box:fill-box;transform-origin:center;animation:pulse 2s 2.8s ease-out infinite}
    @keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
    @keyframes draw{to{stroke-dashoffset:0}}
    @keyframes wipe{to{transform:scaleX(1)}}
    @keyframes pop{from{opacity:0}to{opacity:1}}
    @keyframes pulse{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(3.2)}}
    @media (prefers-reduced-motion: reduce){
      .b,.line,.clip,.pt,.end{animation:none;opacity:1;stroke-dashoffset:0;transform:none}
      .pulse{animation:none}
    }
  </style>
  <g class="grid">
    <line x1="0" y1="60" x2="640" y2="60"/><line x1="0" y1="120" x2="640" y2="120"/>
    <line x1="0" y1="180" x2="640" y2="180"/><line x1="0" y1="240" x2="640" y2="240"/>
  </g>
  <g fill="url(#bar)">
    <rect class="b b1" x="40"  y="200" width="44" height="80" rx="6"/>
    <rect class="b b2" x="140" y="180" width="44" height="100" rx="6"/>
    <rect class="b b3" x="240" y="165" width="44" height="115" rx="6"/>
    <rect class="b b4" x="340" y="140" width="44" height="140" rx="6"/>
    <rect class="b b5" x="440" y="118" width="44" height="162" rx="6"/>
    <rect class="b b6" x="540" y="92"  width="44" height="188" rx="6"/>
  </g>
  <path d="M62 214 L162 190 L262 176 L362 132 L462 108 L562 58 L562 280 L62 280 Z" fill="url(#area)" clip-path="url(#reveal)"/>
  <path class="line" d="M62 214 L162 190 L262 176 L362 132 L462 108 L562 58"/>
  <circle class="pt p1" cx="162" cy="190" r="6"/>
  <circle class="pt p2" cx="262" cy="176" r="6"/>
  <circle class="pt p3" cx="362" cy="132" r="6"/>
  <circle class="pt p4" cx="462" cy="108" r="6"/>
  <circle class="pulse" cx="562" cy="58" r="8"/>
  <circle class="end" cx="562" cy="58" r="8"/>
</svg>
